services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: flink-agents-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - flink-agents-pgvector

volumes:
  pgvector_data:

networks:
  flink-agents-pgvector:
    driver: bridge
